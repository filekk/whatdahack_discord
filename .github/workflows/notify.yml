name: whatdahack → Discord

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to commit seen.json back

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new hackathons
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ONLY_UPCOMING: "1"
          CITY_FILTER: ${{ vars.CITY_FILTER }}   # optional repo variable, e.g. "Łódź,Warszawa,online"
        run: python notify.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen hackathons"
          git push
